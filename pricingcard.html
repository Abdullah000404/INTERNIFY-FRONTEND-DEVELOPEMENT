<!DOCTYPE html>
<html>
    <head>
        <title>Pricing Card</title>
        <style>
            body{
                font-family: Arial, sans-serif;
                text-align: center;
                margin: 0;
                padding: 20px;
                background-color: lightgray;
                box-sizing: border-box;
            }
            h1{
            
                margin-bottom: 20px;
            }
            *toggle{
                margin: 20px;
            }
            *toggle button{
                padding: 10px 20px;
                cursor: pointer;
                border: none;
                background-color: #0000ff;
                margin: 5px;
                border-radius: 5px;
            }
            *:active{
                background-color: #3000cc;
                color: white;
            }
            *filter{
                margin-bottom: 20px;
            }
            *filter button{
                padding: 10px 20px;
                cursor: pointer;
                border: none;
                background-color: #0000ff;
                margin: 5px;
                border-radius: 5px;
            }
            *cards{
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
            }
            *cards .card{
                border-radius: 10px;
                padding: 20px;
                background: white;
                transition: 0.3s;
                position: relative;
                box-shadow: 0 0 10px rgba(44, 5, 5, 0.115);
            }
            .card:hover{
                transform: translateY(-10px);
                box-shadow: 0 0 20px rgba(44, 5, 5, 0.3);
            }
            .badge{
                position: absolute;
                top: 10px;
                right: 10px;
                background-color: #ff0000;
                color: white;
                padding: 5px 10px;
                border-radius: 5px;
                font-size: 12px;
            }
            .icon{
                font-size: 40px;
            
            }
            ul{
                list-style: none;
                margin:15px 0;
            }
            ul li{
                margin: 10px 0;
            }
            .price{
                font-size: 28px;
                color: #04500b;
                margin: 10px 0;
            }
            .buy button{
                padding: 10px 20px;
                cursor: pointer;
                border: none;
                background-color: #a00a0a;
                color: white;
                border-radius: 5px;
                transition: 0.3s;
            }
            .buy button:active{
                transform: scale(0.95);
            }
            
        </style>
    </head>
    <body>
        <h1>Pricing Cards</h1>
       <div class="toggle">
        <button id="monthlybtn" class="active">Monthly</button>
        <button id="yearlybtn">Yearly</button>
       </div>
       <div class="filters">
        <button class="filter-btn active"onclick="filterCards('all')">All</button>
        <button class="filter-btn" onclick="filterCards('basic')">Basic</button>
        <button class="filter-btn"onclick="filterCards('premium')">Premium</button>
       </div>
       <div class="cards">
        <div class="card basic">
            <div class="icon">💻</div>
            <h2>Basic Plan</h2>
            <p>Perfect for individuals starting out.</p>
            <div class="price"data-monthly="$10/month" data-yearly="$100/year" id="basic-price">$10/month</div>
            <ul>
                <li>5GB Storage</li>
                <li>10GB Bandwidth</li>
                <li>Email Support</li>
            </ul>
            <button class="buy"><button>Buy Now</button></div>
            <div class="card premium">
            <div class="badge">Premium</div>
            <div class="icon">🚀</div>
            <h2>Premium Plan</h2>
            <p>For businesses and professionals.</p>
            <div class="price" data-monthly="$30/month" data-yearly="$300/year" id="premium-price">$30/month</div>
            <ul>
                <li>100GB Storage</li>
                <li>1TB Bandwidth</li>
                <li>24/7 Support</li>
            </ul>
            <button class="buy"><button>Buy Now</button></div>
        </div>
        <script>
            const monthlyBtn = document.getElementById('monthlybtn');
            const yearlyBtn = document.getElementById('yearlybtn');
            const basicPrice = document.getElementById('basic-price');
            const premiumPrice = document.getElementById('premium-price');

            monthlyBtn.addEventListener('click', () => {
                basicPrice.textContent = basicPrice.dataset.monthly;
                premiumPrice.textContent = premiumPrice.dataset.monthly;
                monthlyBtn.classList.add('active');
                yearlyBtn.classList.remove('active');
            });

            yearlyBtn.addEventListener('click', () => {
                basicPrice.textContent = basicPrice.dataset.yearly;
                premiumPrice.textContent = premiumPrice.dataset.yearly;
                yearlyBtn.classList.add('active');
                monthlyBtn.classList.remove('active');
            });

            function filterCards(category) {
                const cards = document.querySelectorAll('.card');
                cards.forEach(card => {
                    if (category === 'all' || card.classList.contains(category)) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
                const filterButtons = document.querySelectorAll('.filter-btn');
                filterButtons.forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
            }
            </script>
    </body>
</html>
